name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build release artifacts
        run: xvfb-run --auto-servernum ./gradlew clean build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          VERSION_TYPE: stable
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          version="${GITHUB_REF_NAME#v}"
          for extension in jar exe sh deb; do
            artifact="$(find HMCL/build/libs -maxdepth 1 -type f -name "HMCL-*.$extension" -print -quit)"
            if [ -z "$artifact" ]; then
              echo "::error::Missing .$extension build artifact"
              exit 1
            fi
            name="HMCL-$version.$extension"
            cp "$artifact" "release-assets/$name"
            cp "$artifact.sha256" "release-assets/$name.sha256"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
